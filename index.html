<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>MAHANX EXECUTIVE AI</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B14;--glass:rgba(255,255,255,.06);--edge:rgba(140,200,255,.18);--ink:#E6F0FF;--mute:#8CA0BD;--c1:#22D3EE;--c2:#8B5CF6;--hot:#FB7185;--amb:#FBBF24;--ok:#34D399;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.28),transparent 60%),radial-gradient(700px 500px at 0% 30%,rgba(34,211,238,.16),transparent 60%),var(--bg);background-attachment:fixed}
main{max-width:700px;margin:0 auto;padding:14px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1rem;font-weight:800;margin:0;letter-spacing:1px}
h1 span{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{font-size:.76rem;color:var(--mute)}
.nav{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:4px}
.nav button{white-space:nowrap}
.sm{padding:8px 13px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);border-radius:12px;font:inherit;font-size:.82rem;cursor:pointer}
.sm[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:800}
.go{padding:11px 18px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--c1),var(--c2));color:#06101c;font:inherit;font-weight:800;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.hero{display:flex;flex-direction:column;align-items:center;padding:20px 12px 14px;margin:6px 0}
.orb{width:120px;height:120px;border-radius:50%;border:0;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c1) 22%,var(--c2) 62%,#1b1040 100%);box-shadow:0 0 40px rgba(34,211,238,.55),0 0 90px rgba(139,92,246,.4),inset 0 0 30px rgba(255,255,255,.25);animation:idle 4s ease-in-out infinite}
.orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--edge)}
.orb::after{inset:-30px;border-style:dashed;opacity:.5;animation:spin 24s linear infinite}
.orb.listen{animation:pulse .9s ease-in-out infinite;filter:hue-rotate(120deg)}.orb.speak{animation:pulse 1.3s ease-in-out infinite}.orb.think{animation:spin 1.6s linear infinite}
@keyframes idle{50%{transform:scale(1.04)}}@keyframes pulse{50%{transform:scale(1.13)}}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orb,.orb::after{animation:none!important}}
.say{margin-top:24px;text-align:center;color:var(--mute);font-size:.9rem;min-height:1.8em}
.box{padding:12px 14px;margin:10px 0;white-space:pre-wrap}
textarea{width:100%;min-height:64px;border:0;outline:0;resize:vertical;background:transparent;color:var(--ink);font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.grow{flex:1!important}
.item{display:flex;gap:10px;padding:11px 12px;margin:6px 0;border-radius:16px;align-items:flex-start}
.item input[type=checkbox]{margin-top:7px;width:20px;height:20px;accent-color:var(--c1)}
.item .t{flex:1}.p0{border-right:3px solid var(--hot)}.p1{border-right:3px solid var(--amb)}.p2{border-right:3px solid var(--c1)}.done{opacity:.45}.done b{text-decoration:line-through}
.meta{font-size:.76rem;color:var(--mute)}
.bar{height:6px;border-radius:9px;background:var(--edge);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.1rem}
.empty{color:var(--mute);padding:18px;text-align:center}
.alert{background:linear-gradient(90deg,var(--amb),var(--hot));color:#1a0a0a;border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:800}
.lv{display:inline-block;padding:0 8px;border-radius:9px;font-size:.72rem;font-weight:800;color:#06101c}.l2{background:var(--amb)}.l3{background:var(--hot)}
select,input[type=range]{width:100%;background:var(--glass);color:var(--ink);border:1px solid var(--edge);border-radius:10px;padding:6px;font:inherit}
label{font-size:.8rem;color:var(--mute)}
.xin{flex:1;min-width:0;padding:9px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);border-radius:10px;font:inherit}.xcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.xc{padding:10px;text-align:center}.xc b{display:block;font-size:1.6rem}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(140,200,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(140,200,255,.045) 1px,transparent 1px);background-size:34px 34px}
main{padding-bottom:108px}
.glass{box-shadow:0 8px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.top{position:sticky;top:0;z-index:5;padding:8px 2px;margin-bottom:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav{position:fixed;right:10px;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:2px;max-width:680px;margin:0 auto;padding:6px;border-radius:26px;background:rgba(10,16,30,.74);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:visible}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;border-radius:20px;background:transparent;color:var(--mute);font:inherit;font-size:.68rem;cursor:pointer}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-pressed="true"]{color:#06101c;background:linear-gradient(135deg,var(--c1),var(--c2));font-weight:800}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.tile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:inherit;font-size:.85rem;text-align:right;cursor:pointer;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tile[aria-pressed="true"]{border-color:var(--c1);box-shadow:0 0 18px rgba(34,211,238,.35)}
.badge{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:13px;font-size:1.25rem;background:linear-gradient(135deg,rgba(34,211,238,.32),rgba(139,92,246,.32));border:1px solid var(--edge)}
.badge svg{width:22px;height:22px;fill:none;stroke:var(--c1);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.sm{text-decoration:none;display:inline-block;color:var(--ink)}
.sm[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(bg.jpg) center 6%/min(125vw,780px) no-repeat;opacity:.32;-webkit-mask-image:radial-gradient(ellipse 62% 46% at 50% 26%,#000 0,rgba(0,0,0,.6) 45%,transparent 100%);mask-image:radial-gradient(ellipse 62% 46% at 50% 26%,#000 0,rgba(0,0,0,.6) 45%,transparent 100%)}
@media (prefers-reduced-motion:no-preference){body::after{animation:bgin 1.2s ease both}}@keyframes bgin{from{opacity:0}to{opacity:.32}}
</style>
</head>
<body>
<main>
<div class="top"><h1><img src="logo.png" alt="" width="30" height="30" style="vertical-align:middle;border-radius:50%;margin-left:8px;box-shadow:0 0 14px rgba(34,211,238,.6)"><span>MAHANX</span> EXECUTIVE AI</h1><div class="stat" id="stat"></div></div>
<div id="alerts" aria-live="polite"></div>
<div class="nav" id="nav"></div>
<div id="view"></div>
</main>

<script>
window.claude={use:async n=>{
if(n==="sample"){const f=()=>{};f.json=async p=>{
const k=(localStorage.getItem("mx_gkey")||"").replace(/[^\x21-\x7E]/g,"");if(!k){const e=new Error("nokey");e.code="nokey";throw e}
let last;
for(const m of ["gemini-3.5-flash","gemini-2.5-flash","gemini-3.1-flash-lite","gemini-2.5-flash-lite","gemini-2.5-flash","gemini-3.1-flash-lite","gemini-2.5-flash-lite"]){
const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":k},body:JSON.stringify({contents:[{role:"user",parts:[{text:p}]}],generationConfig:{responseMimeType:"application/json"}})});
if(r.ok){const j=await r.json();const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||"").join("");return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))}
let msg="";try{msg=(await r.json()).error.message}catch(_){}
const zero=/limit: 0/.test(msg);
last=new Error("[v4 "+m+"] "+r.status+": "+msg);last.code=(r.status===429&&!zero)?"rate_limited":"error";
if(r.status===503)await new Promise(z=>setTimeout(z,2500));if(!(r.status===404||r.status===503||(r.status===429&&zero)))break}
throw last};return f}
if(n==="downloads")return{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;a.click()}};
return null}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
<script>
const CATS={"شرکت":["فروش","تعمیرات","حسابداری","تأمین","بحران","توسعه","MahanX"],"شخصی":["خانواده","دوستان","مالی","رشد فردی","متفرقه"]};
const URG={"الان":0,"امروز":1,"این هفته":2};
const TABS=[["asst","🎙️ دستیار"],["dash","📈 داشبورد"],["tasks","✅ کارها"],["rec","📒 دفترها"],["tools","🧰 ابزارها"],["proj","📦 پروژه‌ها"],["appr","🛡️ تأییدها"],["mem","🧠 حافظه"],["rep","📊 گزارش"]];
const MX=["پنل مدیریت مرکزی","پنل مدیران استانی","پنل کشاورزان و کارشناسان","ثبت و مدیریت زمین‌ها","ماشین‌آلات و ارائه‌دهندگان خدمات","سوخت، سهمیه و کیف پول","گزارش‌ها و داشبورد","قابلیت‌های هوش مصنوعی","APIها و سرویس‌های بیرونی","کنترل کیفیت و آزمون"];
let S={tasks:[],projects:[],approvals:[],memory:[],log:[],n:1,v:{voice:"",rate:.95,pitch:1}};
let tab="asst",space="همه",busy=false,speakOn=true,conv=false,lastReply="",lastSay="برای صحبت روی گوی بزنید",rec=null,confirm3=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>{try{return new Date(d).toLocaleString("fa-IR",{weekday:"short",hour:"2-digit",minute:"2-digit",month:"numeric",day:"numeric"})}catch(e){return d}};
const today=()=>new Date().toLocaleDateString("fa-IR");
function load(){try{const r=localStorage.getItem("mahanx_v3")||localStorage.getItem("nexus_v2");if(r){const o=JSON.parse(r);S=Object.assign(S,o);S.v=Object.assign({voice:"",rate:.95,pitch:1},o.v||{});S.tasks.forEach(t=>{if(!t.space)t.space="شرکت"})}}catch(e){}}
function save(){try{localStorage.setItem("mahanx_v3",JSON.stringify(S))}catch(e){}}
function log(m){S.log.unshift({d:new Date().toISOString(),m});S.log=S.log.slice(0,60)}
function orb(c){const o=$("orb");if(o)o.className="orb "+(c||"")}
function say(t){lastSay=t;const s=$("say");if(s)s.textContent=t}

// ---- voice out ----
function voices(){try{return speechSynthesis.getVoices()}catch(e){return[]}}
function bestVoice(){const vs=voices();return vs.find(v=>v.name===S.v.voice)||vs.find(v=>/^fa/i.test(v.lang))||null}
let spkId=0;
function speak(t){return new Promise(res=>{
  if(!("speechSynthesis" in window)||!t){res();return}
  const id=++spkId;try{speechSynthesis.cancel()}catch(e){}
  const parts=String(t).replace(/[*#_`]/g,"").split(/(?<=[.!؟?\n،:])\s+/).filter(x=>x.trim());
  const v=bestVoice();let i=0;
  const next=()=>{if(id!==spkId||i>=parts.length){orb();res();return}
    const u=new SpeechSynthesisUtterance(parts[i++]);u.lang=v?v.lang:"fa-IR";if(v)u.voice=v;u.rate=+S.v.rate;u.pitch=+S.v.pitch;
    u.onstart=()=>orb("speak");u.onend=next;u.onerror=()=>{orb();res()};speechSynthesis.speak(u)};
  next()})}
function stopSpeak(){spkId++;try{speechSynthesis.cancel()}catch(e){}orb()}

// ---- AI ----
const RULES=`تو MAHANX EXECUTIVE AI هستی: دستیار شخصی و مدیر اجرایی شرکت پهپاد کشاورزی و تصویربرداری و اکوسیستم MahanX/AGRIX. فارسی طبیعی و روان، کوتاه و مستقیم و مناسب شنیدن (حداکثر ۵ جمله، بدون ستاره و علامت). اولویت‌ها را با اهمیت، فوریت، اثر مالی، ریسک و وابستگی بسنج. درخواست کلی را به کارهای کوچک تبدیل کن. قانون صداقت: هیچ ابزار بیرونی (ایمیل، پیامک، تقویم، پایگاه داده) متصل نیست؛ هرگز ادعا نکن چیزی ارسال یا اجرا شده، فقط ثبت، برنامه‌ریزی و پیش‌نویس. وجود هر API یا ماژول MahanX را فرض نکن. اقدام سطح ۲ (پیام به مشتری، پیشنهاد تجاری، تعهد، انتشار) و سطح ۳ (پرداخت، قرارداد، حذف دائمی، تغییر مجوز، انتشار نسخه) را فقط در approvals بگذار با پیش‌نویس کامل در detail. هر تماس لازم یا انجام‌شده (call)، قول داده‌شده به دیگران (promise)، دستگاه تعمیری (repair) و دریافتی یا پرداختی (money) را در records ثبت کن و تاریخ‌ها را دقیق بنویس.`;
async function ask(job,text,keep){
  if(busy)return;busy=true;orb("think");say("در حال فکر کردن...");
  let sample=null;try{sample=await claude.use("sample")}catch(e){}
  if(!sample){say("دستیار هوشمند در دسترس نیست؛ صفحه را دوباره باز کنید.");orb();busy=false;return null}
  const ctx={tasks:S.tasks.filter(t=>!t.done).map(t=>({id:t.id,text:t.text,space:t.space,cat:t.cat,urgency:t.urgency,due:t.due,project:t.project})),projects:S.projects.map(p=>p.name),decisions:S.memory.slice(0,8).map(m=>m.text)};
  const prompt=`${RULES}
الان: ${new Date().toString()}
وضعیت: ${JSON.stringify(ctx)}
وظیفه: ${job}
ورودی مدیر: ${text||"-"}
فقط JSON معتبر: {"reply":"","tasks":[{"text":"","space":"شرکت|شخصی","cat":"شرکت: ${CATS["شرکت"].join("/")} | شخصی: ${CATS["شخصی"].join("/")}","urgency":"الان|امروز|این هفته","due":"YYYY-MM-DDTHH:MM محلی یا خالی","project":"نام پروژه یا خالی"}],"projects":[{"name":"","goal":"","owner":"","due":""}],"decisions":[{"text":"","why":""}],"approvals":[{"level":2,"title":"","detail":""}],"done":[],"records":[{"type":"call|promise|repair|money","who":"","title":"","detail":"","amount":"","kind":"دریافتی|پرداختی","due":"YYYY-MM-DDTHH:MM یا خالی"}]}`;
  let reply="";
  try{
    const A=x=>Array.isArray(x)?x:[];const r=await sample.json(prompt,{cache:false});if(!r||typeof r!=="object"||Array.isArray(r))throw new Error("پاسخ هوش مصنوعی قالب درستی نداشت؛ دوباره بفرستید");reply=String(r.reply||"");
    A(r.projects).forEach(p=>{if(p&&p.name&&!S.projects.some(x=>x.name===p.name)){S.projects.push({id:S.n++,name:p.name,goal:p.goal||"",owner:p.owner||"",due:p.due||"",note:""});log("پروژه: "+p.name)}});
    A(r.tasks).forEach(t=>{if(t&&t.text){const sp=t.space==="شخصی"?"شخصی":"شرکت";S.tasks.push({id:S.n++,text:t.text,space:sp,cat:CATS[sp].includes(t.cat)?t.cat:CATS[sp][CATS[sp].length-1],urgency:URG[t.urgency]!==undefined?t.urgency:"این هفته",due:t.due||"",project:t.project||"",done:false,fired:false});log("کار: "+t.text)}});
    A(r.decisions).forEach(d=>{if(d&&d.text){S.memory.unshift({id:S.n++,date:today(),text:d.text,why:d.why||"",src:"گفت‌وگو"});log("تصمیم ثبت شد")}});
    A(r.approvals).forEach(a=>{if(a&&a.title){S.approvals.push({id:S.n++,level:+a.level===3?3:2,title:a.title,detail:a.detail||"",status:"منتظر"});log("درخواست تأیید: "+a.title)}});
    A(r.done).forEach(id=>{const t=S.tasks.find(x=>x.id==id);if(t){t.done=true;log("انجام شد: "+t.text)}});A(r.records).forEach(o=>{if(o&&XS[o.type]){S.rec=S.rec||[];S.rec.push({id:S.n++,type:o.type,who:o.who||"",title:o.title||"",detail:o.detail||"",amount:String(o.amount||""),kind:o.kind||"",due:o.due||"",status:XS[o.type][0],date:today()});log("دفتر: "+(o.who||o.detail||o.type))}});
    save();
  }catch(e){reply=e&&e.code==="rate_limited"?"درخواست‌ها زیاد شد، کمی بعد دوباره بگویید.":(e&&e.code==="nokey"?"ابتدا کلید Gemini را در بخش «کلید Gemini» همین صفحه وارد کنید.":"پاسخ دریافت نشد. علت: [v5] "+(e?((e.name||"")+": "+(e.message||"")):"نامشخص"))}
  lastReply=reply;busy=false;orb();say("آماده‌ام");render();
  if(speakOn)await speak(reply);
  if(conv&&tab==="asst")listen();
  return reply;
}

// ---- voice in ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
  if(!SR){say("مرورگر شما دستور صوتی را پشتیبانی نمی‌کند؛ بنویسید.");return}
  if(rec){rec.stop();return}
  stopSpeak();rec=new SR();rec.lang="fa-IR";let got="";
  rec.onresult=e=>{got=Array.from(e.results).map(r=>r[0].transcript).join(" ");say(got)};
  rec.onend=()=>{rec=null;orb();if(got.trim())ask("درخواست را اجرا کن: کار ثبت کن، مشورت بده یا پیش‌نویس بنویس.",got);else{conv=false;say("چیزی نشنیدم؛ دوباره امتحان کنید");render()}};
  rec.onerror=()=>{rec=null;orb();conv=false;say("میکروفون در دسترس نیست")};
  try{rec.start();orb("listen");say("گوش می‌دهم...")}catch(e){rec=null}
}

// ---- views ----
function head(){
  const o=S.tasks.filter(t=>!t.done);
  $("stat").textContent=`${o.length} کار · ${o.filter(t=>t.urgency==="الان").length} فوری · ${S.approvals.filter(a=>a.status==="منتظر").length} منتظر تأیید`;
  $("nav").innerHTML=navHtml();
}
function taskHtml(t){return `<div class="glass item p${URG[t.urgency]??2} ${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} data-chk="${t.id}" aria-label="انجام شد"><div class="t"><b>${esc(t.text)}</b><div class="meta">${esc(t.space)} / ${esc(t.cat)} · ${esc(t.urgency)}${t.project?" · 📦 "+esc(t.project):""}${t.due?" · ⏰ "+esc(fmt(t.due)):""}</div></div><button class="x" data-del="${t.id}" aria-label="حذف">✕</button></div>`}
function view(){

<label>زیروبمی</label><input type="range" id="vpitch" min=".7" max="1.4" step=".05" value="${S.v.pitch}">

  }

    let ts=S.tasks.filter(t=>space==="همه"||t.space===space).sort((a,b)=>(a.done-b.done)||((URG[a.urgency]??2)-(URG[b.urgency]??2))||String(a.due||"z").localeCompare(String(b.due||"z")));

  }

    return `<div class="row"><button class="sm" data-a="seed">+ ماژول‌های MahanX</button><button class="sm" data-a="projplan">🧠 تقسیم پروژه‌ها به کار</button></div>`+(S.projects.length?S.projects.map(p=>{const ts=S.tasks.filter(t=>t.project===p.name);const d=ts.filter(t=>t.done).length;const pc=ts.length?Math.round(d/ts.length*100):0;return `<div class="glass item"><div class="t"><b>${esc(p.name)}</b><div class="meta">${p.goal?esc(p.goal)+" · ":""}${p.owner?"مسئول: "+esc(p.owner)+" · ":""}${p.due?"موعد: "+esc(p.due)+" · ":""}${ts.length?d+" از "+ts.length+" کار":"بدون کار ثبت‌شده"} · وضعیت فنی: بررسی‌نشده</div><div class="bar"><i style="width:${pc}%"></i></div></div><button class="x" data-delp="${p.id}" aria-label="حذف">✕</button></div>`}).join(""):`<div class="empty">پروژه‌ای نیست. دکمه بالا را بزنید یا بگویید «پروژه جدید».</div>`);

  }
  return `<div class="row"><button class="sm" data-rep="گزارش صبحگاهی: مهم‌ترین اولویت‌ها، قرارها و مهلت‌ها، کارهای عقب‌افتاده، تصمیم‌های لازم و مهم‌ترین اقدام برای پیشرفت شرکت.">🌅 صبحگاهی</button><button class="sm" data-rep="گزارش پایان روز: انجام‌شده‌ها، ناتمام‌ها، علت تأخیر، موانع و ریسک‌ها و برنامه فردا.">🌙 پایان روز</button><button class="sm" data-rep="گزارش هفتگی شرکت: وضعیت پروژه‌ها، پیشرفت MahanX، کارهای عقب‌افتاده، تصمیم‌های معوق، ریسک‌های اصلی و برنامه هفته بعد.">📅 هفتگی</button></div><div class="glass box" id="repbox">${lastReply?esc(lastReply):"یک گزارش انتخاب کنید؛ متن آن نمایش داده و با صدا خوانده می‌شود."}</div>`;
}
function render(){
  head();const v=$("view");const keep=$("inp")?$("inp").value:"";v.innerHTML=view();if($("inp"))$("inp").value=keep;

}

// ---- events ----
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.tab){tab=d.tab;render();return}
  if(d.sp){space=d.sp;render();return}
  if(d.chk!==undefined)return;
  if(d.del){S.tasks=S.tasks.filter(x=>x.id!=d.del);save();render();return}
  if(d.delp){S.projects=S.projects.filter(x=>x.id!=d.delp);save();render();return}
  if(d.delm){S.memory=S.memory.filter(x=>x.id!=d.delm);save();render();return}
  if(d.rep){ask(d.rep,"",1);return}
  if(d.ok){const a=S.approvals.find(x=>x.id==d.ok);if(!a)return;if(a.level===3&&confirm3!==a.id){confirm3=a.id;render();return}a.status="تأییدشده";confirm3=null;log("تأیید شد: "+a.title);save();render();return}
  if(d.no){const a=S.approvals.find(x=>x.id==d.no);if(a){a.status="ردشده";log("رد شد: "+a.title);save();render()}return}
  if(d.copy){const a=S.approvals.find(x=>x.id==d.copy);try{navigator.clipboard.writeText(a.detail);b.textContent="کپی شد"}catch(_){b.textContent="کپی ممکن نیست"}return}
  switch(d.a){
    case"orb":listen();break;
    case"send":{const t=$("inp").value.trim();if(t){$("inp").value="";ask("درخواست را اجرا کن: کار ثبت کن، مشورت بده یا پیش‌نویس بنویس.",t)}break}
    case"conv":conv=!conv;render();if(conv)listen();break;
    case"mute":speakOn=!speakOn;if(!speakOn)stopSpeak();render();break;
    case"stop":stopSpeak();conv=false;if(rec)rec.stop();render();break;
    case"test":speak("سلام، من دستیار اجرایی ماهان‌ایکس هستم. آماده‌ام تا کارهای شما را منظم کنم.");break;
    case"clr":S.tasks=S.tasks.filter(t=>!t.done);save();render();break;
    case"seed":MX.forEach(n=>{if(!S.projects.some(p=>p.name===n))S.projects.push({id:S.n++,name:"MahanX · "+n,goal:"",owner:"",due:""})});log("ماژول‌های MahanX اضافه شد");save();render();break;
    case"projplan":ask("برای پروژه‌های بدون کار، حداکثر ۸ کار اجرایی کوچک با فیلد project مناسب بساز و اولویت‌بندی کن. بدون فرض وجود هیچ ماژول.","",1);break;
    case"exp":(async()=>{try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:"mahanx-backup.json",data:JSON.stringify(S,null,2)});return}}catch(_){}say("ذخیره فایل ممکن نیست")})();break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.chk){const k=S.tasks.find(x=>x.id==t.dataset.chk);if(k){k.done=t.checked;log((k.done?"انجام شد: ":"بازگشت: ")+k.text);save();render()}}
  if(t.id==="akey"&&t.value.trim()){const kk=t.value.replace(/[^\x21-\x7E]/g,"");if(kk.length<20){t.value="";t.placeholder="کلید نامعتبر است؛ باید با AIza شروع شود"}else{localStorage.setItem("mx_gkey",kk);t.value="";t.placeholder="ذخیره شد ✓"}}if(t.id==="vsel"){S.v.voice=t.value;save()}
  if(t.id==="vrate"){S.v.rate=t.value;save()}
  if(t.id==="vpitch"){S.v.pitch=t.value;save()}
});

// ---- reminders (page must be open) ----
function check(){
  const now=Date.now();let ch=false;
  S.tasks.forEach(t=>{if(!t.done&&t.due&&!t.fired&&new Date(t.due).getTime()<=now){t.fired=true;ch=true;
    const d=document.createElement("div");d.className="alert";d.textContent="⏰ "+t.text;$("alerts").appendChild(d);
    try{if("Notification" in window&&Notification.permission==="granted")new Notification("یادآوری",{body:t.text})}catch(e){}
    if(speakOn)speak("یادآوری: "+t.text)}});
  if(ch)save();
}
setInterval(check,20000);
try{if("Notification" in window&&Notification.permission==="default")document.addEventListener("click",()=>Notification.requestPermission(),{once:true})}catch(e){}
try{speechSynthesis.onvoiceschanged=()=>{if(tab==="asst"&&!busy&&!rec)render()}}catch(e){}
addEventListener("DOMContentLoaded",()=>{load();render();check()});

<script>

const XS={call:["منتظر پیگیری","انجام شد"],promise:["باز","انجام شد"],repair:["دریافت‌شده","در حال تعمیر","منتظر قطعه","آماده تحویل","تحویل شد"],money:["معوق","تسویه شد"]};
const XD=new Set(["انجام شد","تحویل شد","تسویه شد"]);
const BASE="تو دستیار اجرایی مدیر یک شرکت پهپاد کشاورزی و تصویربرداری هستی. فارسی روان و حرفه‌ای. قیمت، تاریخ، شماره، مشخصات فنی و قوانین را از خودت نساز؛ جای نامعلوم را به شکل [ ... ] خالی بگذار. خروجی متن ساده باشد (بدون ستاره و علامت markdown).";
const TL=[
{id:"reply",i:"💬",n:"پاسخ‌یار مشتری",h:"پیام یا یادداشت تماس مشتری را بدهید.",ph:"متن پیام مشتری...",p:"یک پاسخ آماده برای ارسال در واتساپ بنویس، کوتاه و محترمانه. دو نسخه بده: رسمی و صمیمی. اگر اطلاعاتی لازم است که ندارم، آخر یک سؤال کوتاه بنویس."},
{id:"quote",i:"🧾",n:"پیش‌فاکتور",h:"مشتری، مدل، تعداد و شرایط را بگویید.",ph:"مثلاً: شرکت کشت‌وصنعت X، دو دستگاه پهپاد سمپاش، تحویل ۲۰ روزه...",p:"پیش‌نویس رسمی پیش‌فاکتور یا پیشنهاد قیمت بنویس با بخش‌های: مشخصات، شرایط پرداخت، تحویل، گارانتی. قیمت‌ها را فقط اگر در ورودی هست بنویس وگرنه [ ... ]."},
{id:"parts",i:"🔩",n:"قطعات و تأمین",h:"موجودی یا نیاز قطعات را بنویسید.",ph:"مثلاً: ملخ ۲ عدد مانده، باتری ۱ عدد، موتور صفر...",p:"اولویت سفارش قطعات را مشخص کن (فوری/این ماه/بعداً) با دلیل، و سؤال‌های لازم برای تأمین‌کننده را فهرست کن."},

{id:"prop",i:"📄",n:"پروپوزال فروش",h:"مخاطب و نیاز او را بگویید.",ph:"مثلاً: کشاورز ۵۰ هکتاری گندم، می‌خواهد سمپاشی ارزان‌تر کند...",p:"پروپوزال فروش قانع‌کننده و صادقانه بنویس: مشکل مخاطب، راه‌حل با پهپاد، مزایا، مراحل همکاری و گام بعدی. ادعای عددی بدون منبع نساز."},
{id:"decide",i:"⚖️",n:"مغز تصمیم",h:"تصمیم یا دوراهی را شرح دهید.",ph:"مثلاً: بین واردات مستقیم و خرید از نمایندگی...",save:1,p:"به‌عنوان مشاور صریح پاسخ بده: گزینه‌ها، مزایا و معایب هرکدام، ریسک‌ها، پیشنهاد نهایی با دلیل، و اولین قدم اجرایی."},

{id:"coach",i:"🌿",n:"مربی رشد فردی",h:"هدف یا وضعیت خود را بگویید.",ph:"مثلاً: وقت کم می‌آورم و برای خانواده زمان نمی‌گذارم...",save:1,p:"مربی دوستانه و عملی باش: یک هدف هفتگی کوچک، سه عادت ساده و قابل‌اجرا، و یک یادآوری ملایم برای تعادل کار و زندگی. توصیه پزشکی نکن."}
];
let XT="call",curTool=null,toolOut="",toolIn="",XBUSY=false,scanMsg="",xmsg="";
const R=()=>(S.rec=S.rec||[]);
const xover=r=>r.due&&!XD.has(r.status)&&new Date(r.due).getTime()<Date.now();
const MODELS=["gemini-3.5-flash","gemini-2.5-flash","gemini-3.1-flash-lite","gemini-2.5-flash-lite","gemini-2.5-flash"];
async function gem(parts){
 const k=(localStorage.getItem("mx_gkey")||"").replace(/[^\x21-\x7E]/g,"");
 if(!k)throw new Error("ابتدا کلید Gemini را در بخش دستیار وارد کنید");
 let last;
 for(const m of MODELS){
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":k},body:JSON.stringify({contents:[{role:"user",parts}]})});
  if(r.ok){const j=await r.json();const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||"").join("");if(t.trim())return t;last=new Error("پاسخ خالی بود");continue}
  let msg="";try{msg=(await r.json()).error.message}catch(_){}
  const zero=/limit: 0/.test(msg);last=new Error(r.status+": "+msg);
  if(r.status===503)await new Promise(z=>setTimeout(z,2500));
  if(!(r.status===404||r.status===503||(r.status===429&&zero)))break}
 throw last}
function xctx(){return{tasks:S.tasks.filter(t=>!t.done).slice(0,30).map(t=>({text:t.text,cat:t.cat,urgency:t.urgency,due:t.due})),records:R().filter(r=>!XD.has(r.status)).slice(0,30).map(r=>({type:r.type,who:r.who,title:r.title,detail:r.detail,due:r.due,status:r.status}))}}

 const list=R().filter(r=>r.type===XT).sort((a,b)=>(XD.has(a.status)-XD.has(b.status))||String(a.due||"z").localeCompare(String(b.due||"z")));
 const ph={call:"نام مشتری / تماس‌گیرنده",promise:"قول به چه کسی؟",repair:"نام مشتری",money:"طرف حساب"};
 return `<div class="row">${Object.keys(XL).map(k=>`<button class="sm" data-xt="${k}" aria-pressed="${k===XT}">${XL[k]}</button>`).join("")}</div><div class="glass box"><div class="row"><input id="xw" class="xin" placeholder="${ph[XT]}">${XT==="repair"?'<input id="xti" class="xin" placeholder="دستگاه / مدل">':""}</div><input id="xd" class="xin" placeholder="${XT==="money"?"بابت چه؟":XT==="repair"?"مشکل دستگاه":XT==="promise"?"چه قولی داده‌اید؟":"موضوع تماس"}" style="width:100%;margin-top:6px"><div class="row" style="margin-top:6px">${XT==="money"?'<input id="xa" class="xin" placeholder="مبلغ"><select id="xk" class="xin"><option>دریافتی</option><option>پرداختی</option></select>':""}<input id="xdue" type="datetime-local" class="xin"><button class="go" data-xadd="1">افزودن</button></div></div>`+(list.length?list.map(recItem).join(""):`<div class="empty">موردی ثبت نشده. می‌توانید در بخش دستیار هم بگویید.</div>`)}

 toolIn=$("xin")?$("xin").value.trim():"";
 if(!t.noin&&!toolIn){toolOut="ابتدا متن را وارد کنید.";render();return}

 catch(e){toolOut="پاسخ دریافت نشد. علت: "+(e&&e.message||"نامشخص")}

async function scan(f){
 scanMsg="در حال خواندن تصویر...";render();
 try{
  const b64=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8).split(",")[1])};im.onerror=()=>rej(new Error("تصویر خوانده نشد"));im.src=URL.createObjectURL(f)});
  const t=await gem([{text:'این تصویر (فاکتور، کارت ویزیت، برگه تعمیر یا یادداشت) را بخوان و فقط JSON بده: {"type":"call|promise|repair|money","who":"","title":"","detail":"","amount":"","kind":"دریافتی|پرداختی","due":"","summary":"خلاصه یک‌جمله"}. هرچه خوانا نیست خالی بگذار و چیزی نساز. فاکتور=money، برگه تعمیر=repair، کارت ویزیت=call.'},{inline_data:{mime_type:"image/jpeg",data:b64}}]);
  const o=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
  const ty=["call","promise","repair","money"].includes(o.type)?o.type:"call";
  R().push({id:S.n++,type:ty,who:o.who||"",title:o.title||"",detail:o.detail||"",amount:String(o.amount||""),kind:o.kind||"",due:o.due||"",status:XS[ty][0],date:today()});
  log("اسکن: "+(o.summary||ty));save();scanMsg="ثبت شد در دفتر «"+XL[ty]+"»: "+(o.summary||"")+" (بررسی و اصلاح کنید)";
 }catch(e){scanMsg="اسکن ناموفق: "+(e&&e.message||"نامشخص")}
 render()}

async function tgSend(text){const t=LS("mx_tgt"),c=LS("mx_tgc");if(!t||!c)throw new Error("ابتدا توکن و Chat ID را ذخیره کنید");
 const r=await fetch("https://api.telegram.org/bot"+t+"/sendMessage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chat_id:c,text:String(text).slice(0,4000)})});
 const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.description||("خطا "+r.status));return true}
async function tgNotify(t){if(LS("mx_tgon")==="1"){try{await tgSend("⏰ "+t)}catch(e){}}}
function digest(k){const op=S.tasks.filter(t=>!t.done).sort((a,b)=>(URG[a.urgency]??2)-(URG[b.urgency]??2)),r=R().filter(x=>!XD.has(x.status));
 const L=[k==="m"?"🌅 گزارش صبحگاهی":"🌙 گزارش پایان روز","",`کار باز: ${op.length} | فوری: ${op.filter(t=>t.urgency==="الان").length}`];
 if(op.length)L.push("","✅ مهم‌ترین کارها:",...op.slice(0,5).map(t=>"• "+t.text));
 const p=r.filter(x=>x.type==="promise");if(p.length)L.push("","🤝 قول‌های باز:",...p.slice(0,5).map(x=>"• "+(x.who||"")+" - "+(x.detail||"")+(xover(x)?" (عقب‌افتاده)":"")));
 const c=r.filter(x=>x.type==="call");if(c.length)L.push("","📞 منتظر پیگیری: "+c.map(x=>x.who||x.detail).join("، "));
 const q=r.filter(x=>x.type==="repair");if(q.length)L.push("","🔧 تعمیرات جاری: "+q.length);
 const ov=r.filter(xover).length;if(ov)L.push("","⚠️ عقب‌افتاده در دفترها: "+ov);
 return L.join("\n")}
function tgView(){const on=LS("mx_tgon")==="1";
 return `<div class="glass box"><b>✈️ تلگرام (پیام خودکار به خودتان)</b><div class="meta">ربات شما گزارش و یادآوری را در تلگرام خودتان می‌فرستد. فقط وقتی برنامه باز است کار می‌کند.</div>
<details style="margin:8px 0"><summary>راهنمای ساخت ربات (۲ دقیقه)</summary><div class="meta">۱) در تلگرام @BotFather را باز کنید، /newbot بزنید، نام و نام کاربری بدهید و توکن را کپی کنید. ۲) ربات خودتان را باز کنید و Start بزنید و یک پیام بفرستید. ۳) توکن را اینجا بگذارید و «پیدا کردن Chat ID» را بزنید.</div></details>
<input id="tgt" type="password" class="xin" style="width:100%;margin-bottom:6px" placeholder="${LS("mx_tgt")?"توکن ذخیره شده ✓ (برای تغییر، توکن جدید)":"توکن ربات"}">
<input id="tgc" class="xin" style="width:100%" value="${esc(LS("mx_tgc"))}" placeholder="Chat ID">
<div class="row" style="margin-top:8px"><button class="sm" data-tg="save">ذخیره</button><button class="sm" data-tg="find">پیدا کردن Chat ID</button><button class="sm" data-tg="test">ارسال تست</button></div>
<div class="row" style="margin-top:8px"><button class="sm" data-tg="toggle" aria-pressed="${on}">${on?"✓ یادآوری‌ها به تلگرام می‌روند":"ارسال خودکار یادآوری‌ها به تلگرام"}</button></div>
<div class="row" style="margin-top:8px"><button class="sm" data-tg="m">🌅 ارسال گزارش صبحگاهی</button><button class="sm" data-tg="e">🌙 ارسال گزارش پایان روز</button></div>
<label>گزارش خودکار روزانه (ساعت، مثلاً 08:00، وقتی برنامه باز است)</label><input id="tgtime" class="xin" style="width:100%" value="${esc(LS("mx_tgtime"))}" placeholder="08:00">
<div class="meta">${esc(tgMsg)}</div></div>
<div class="glass box"><b>💬 واتساپ</b><div class="meta">ارسال کاملاً خودکار واتساپ بدون API رسمی ممکن نیست. در «دفترها» برای هر مشتری با شماره، دکمه واتساپ پیام آماده را باز می‌کند و شما فقط «ارسال» را می‌زنید. پیش‌شماره کشور برای شماره‌هایی که با 0 شروع می‌شوند:</div><input id="tgcc" class="xin" value="${esc(S.cc||"98")}" style="width:100%"></div>
<div class="meta">توکن فقط روی همین گوشی می‌ماند. اگر تلگرام در منطقه شما فیلتر است، ممکن است به VPN نیاز باشد.</div>`}
const MORE=[["tools","ایجنت‌ها و ابزارها","wrench"],["proj","پروژه‌ها","box"],["appr","تأییدها","shield"],["mem","حافظه","brain"],["rep","گزارش‌ها","doc"],["tg","تلگرام و واتساپ","send"]];
function moreView(){return `<div class="tgrid">${MORE.map(([k,l,i])=>`<button class="tile" data-tab="${k}"><span class="badge">${svg(i)}</span><b>${l}</b></button>`).join("")}</div>`}
const _view=view;
view=function(){
 if(tab==="more")return moreView();
 const h=tab==="tg"?tgView():_view();
 return ["tools","proj","appr","mem","rep","tg"].includes(tab)?`<button class="sm" data-tab="more" style="margin-bottom:8px">← بیشتر</button>`+h:h};
function navHtml(){const NV=[["asst","mic","دستیار"],["dash","chart","داشبورد"],["tasks","tasks","کارها"],["rec","book","دفترها"],["more","grid","بیشتر"]];
 const mo=["more","tools","proj","appr","mem","rep","tg"].includes(tab);
 return NV.map(([k,i,l])=>`<button data-tab="${k}" aria-pressed="${k==="more"?mo:k===tab}">${svg(i)}<span>${l}</span></button>`).join("")}
document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.ttg){try{await tgSend(toolOut);b.textContent="ارسال شد ✓"}catch(x){b.textContent="خطا: "+x.message}}
 else if(d.xmk){tab="tasks";ask("از متن زیر کارها و قول‌ها را استخراج و ثبت کن (کار در tasks و قول‌ها یا تماس‌ها در records).",toolOut)}
 else if(d.tg){
  const g=id=>($(id)?$(id).value.trim():"");
  try{
   if(d.tg==="save"){const t=g("tgt").replace(/\s/g,""),c=g("tgc").replace(/\s/g,"");if(t)localStorage.setItem("mx_tgt",t);if(c)localStorage.setItem("mx_tgc",c);localStorage.setItem("mx_tgtime",g("tgtime"));const cc=nd(g("tgcc")).replace(/\D/g,"");if(cc){S.cc=cc;save()}tgMsg="ذخیره شد ✓"}
   if(d.tg==="find"){const t=g("tgt").replace(/\s/g,"")||LS("mx_tgt");if(!t)throw new Error("اول توکن را وارد کنید");localStorage.setItem("mx_tgt",t);
    const r=await fetch("https://api.telegram.org/bot"+t+"/getUpdates");const j=await r.json();if(!j.ok)throw new Error(j.description||"توکن نادرست است");
    const u=(j.result||[]).map(x=>x.message||x.edited_message).filter(Boolean).pop();if(!u)throw new Error("پیامی پیدا نشد؛ در تلگرام به ربات یک پیام بفرستید و دوباره بزنید");
    localStorage.setItem("mx_tgc",String(u.chat.id));tgMsg="Chat ID پیدا و ذخیره شد ✓"}
   if(d.tg==="test"){await tgSend("✅ اتصال MahanX AI برقرار است.");tgMsg="پیام تست ارسال شد ✓"}
   if(d.tg==="toggle"){localStorage.setItem("mx_tgon",LS("mx_tgon")==="1"?"0":"1");tgMsg=""}
   if(d.tg==="m"||d.tg==="e"){await tgSend(digest(d.tg));tgMsg="گزارش ارسال شد ✓"}
  }catch(x){tgMsg="خطا: "+(x.message||"نامشخص")}
  render()}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset&&t.dataset.xph){const r=R().find(x=>x.id==t.dataset.xph);if(r&&t.value.trim()){r.phone=t.value.trim();save();render()}}});
try{new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(n=>{if(n.classList&&n.classList.contains("alert"))tgNotify(n.textContent)}))).observe($("alerts"),{childList:true})}catch(e){}
setInterval(async()=>{const tm=nd(LS("mx_tgtime")).trim();if(!/^\d{1,2}:\d{2}$/.test(tm)||!LS("mx_tgt"))return;
 const n=new Date(),hm=("0"+n.getHours()).slice(-2)+":"+("0"+n.getMinutes()).slice(-2),key=n.toDateString();
 if(hm>=("0"+tm).slice(-5)&&LS("mx_tgsent")!==key){localStorage.setItem("mx_tgsent",key);try{await tgSend(digest("m"))}catch(e){}}},30000);
</script>
